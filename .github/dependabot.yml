version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    groups:
      production-dependencies:
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - minor
          - patch

      development-dependencies:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    groups:
      actions-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
